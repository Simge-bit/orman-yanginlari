name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "data/raw/**"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  schedule:
    # Canlı sıcak nokta katmanının tazeliği için — kod değişmese de veri tazelenir.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pipeline'ı çalıştır (raw -> processed -> web/assets/data)
        run: |
          pip install -r requirements.txt
          python src/01_ingest.py
          python src/02_clean.py
          python src/03_transform.py
          python src/04_analyze.py
          python src/05_export.py
      - name: Testleri çalıştır
        run: pytest tests/ -q
      - name: Canlı sıcak nokta katmanını çek (NASA FIRMS)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python src/fetch_hotspots.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
